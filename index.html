<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Mayaluu ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e0,#ffc2d1);
overflow-x:hidden;
text-align:center;
color:white;
}

.hero{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
}

.photo{
width:320px;
max-width:90%;
border-radius:25px;
border:6px solid white;
box-shadow:0 0 30px rgba(255,255,255,.5);
}

h1{
font-size:3rem;
margin-top:20px;
}

.message{
margin-top:20px;
font-size:1.2rem;
max-width:600px;
line-height:1.8;
}

.date-box{
margin-top:30px;
background:rgba(255,255,255,.2);
padding:20px;
border-radius:20px;
backdrop-filter:blur(10px);
}

.floating{
position:fixed;
font-size:30px;
animation:float 10s linear infinite;
pointer-events:none;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="hero">

<img src="IMG-20260505-WA0012.jpg" class="photo">

<h1>For My Mayaluu ❤️</h1>

<div class="message">
Babe, I loveee you soooooo muchhhhhhh 💕<br><br>
Every moment with you feels special.
You make my days brighter and my heart happier.
</div>

<div class="date-box">
💖 Anniversary Date 💖<br><br>
19 March 2026
</div>

</div>

<script>
function createHeart(){
let h=document.createElement("div");
h.className="floating";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},10000);
}

setInterval(createHeart,600);
</script>

</body>
</html>
