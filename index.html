<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Mayaluu ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
overflow:hidden;
background:#f8d6e2;
color:white;
}

.scene{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:1.5s;
}

.hidden{
opacity:0;
pointer-events:none;
}

#scene1{
background:linear-gradient(135deg,#ffd7e7,#f8bfd4);
z-index:10;
}

.envelope{
font-size:90px;
cursor:pointer;
animation:bounce 1.8s infinite;
}

.tap{
margin-top:15px;
font-size:22px;
}

@keyframes bounce{
50%{transform:translateY(-15px);}
}

#scene2{
background:linear-gradient(135deg,#ffd7e7,#f6c4d8);
opacity:0;
}

.photo{
width:320px;
max-width:85vw;
border:8px solid white;
border-radius:25px;
box-shadow:0 0 35px rgba(255,255,255,.5);
animation:zoom 8s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

h1{
margin-top:20px;
font-size:3rem;
text-align:center;
}

.message{
font-size:1.2rem;
max-width:700px;
text-align:center;
padding:20px;
}

.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(8px);
padding:25px;
border-radius:20px;
margin-top:20px;
}

button{
padding:15px 25px;
border:none;
border-radius:40px;
font-size:18px;
cursor:pointer;
background:white;
color:#ff4b7d;
font-weight:bold;
margin-top:20px;
}

.flower{
position:fixed;
pointer-events:none;
animation:float linear forwards;
z-index:999;
}

@keyframes float{
0%{
transform:translateY(110vh) rotate(0deg);
opacity:0;
}
10%{
opacity:1;
}
100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}

.sparkle{
position:fixed;
font-size:22px;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
50%{
transform:scale(1.5);
opacity:.5;
}
}

.fadeText{
animation:fadeIn 3s;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<audio id="music" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<div id="scene1" class="scene">

<div class="envelope" onclick="openLove()">💌</div>
<div class="tap">Tap to Open ❤️</div>

</div>

<div id="scene2" class="scene hidden">

<img src="IMG-20260505-WA0012.jpg" class="photo">

<h1 class="fadeText">For My Mayaluu ❤️</h1>

<div class="message fadeText">
Babe, I loveee you soooooo muchhhhhhh ❤️<br><br>
Every moment with you feels special.
You make my days brighter and my heart happier. 🌹
</div>

<div class="card fadeText">
💕 Anniversary Date 💕
<br><br>
19 March 2026
</div>

<button onclick="toggleMusic()">🎵 Play Our Song</button>

</div>

<script>

const music=document.getElementById("music");

function openLove(){

document.getElementById("scene1").classList.add("hidden");

const scene2=document.getElementById("scene2");

setTimeout(()=>{
scene2.classList.remove("hidden");
scene2.style.opacity="1";
},800);

music.play().catch(()=>{});

bloomFlowers();

}

function toggleMusic(){

if(music.paused){
music.play();
}else{
music.pause();
}

}

const flowers=[
"pngwing.com.png",
"pngwing.com-1.png",
"pngwing.com-2.png"
];

function createFlower(){

let flower=document.createElement("img");

flower.src=flowers[Math.floor(Math.random()*flowers.length)];

flower.className="flower";

flower.style.left=Math.random()*100+"vw";

let size=40+Math.random()*80;

flower.style.width=size+"px";

flower.style.animationDuration=
(8+Math.random()*8)+"s";

document.body.appendChild(flower);

setTimeout(()=>{
flower.remove();
},16000);

}

function bloomFlowers(){

for(let i=0;i<25;i++){

setTimeout(()=>{
createFlower();
},i*120);

}

setInterval(createFlower,900);

}

for(let i=0;i<15;i++){

let s=document.createElement("div");

s.className="sparkle";

s.innerHTML="✨";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*3+"s";

document.body.appendChild(s);

}

</script>

</body>
</html>
