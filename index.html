<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Mayaluu ❤️</title>
<style>
body{
margin:0;
background:#f8d6e2;
font-family:sans-serif;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
min-height:100vh;
text-align:center;
overflow:hidden;
}

.photo{
width:320px;
max-width:85vw;
border:8px solid white;
border-radius:25px;
box-shadow:0 0 25px rgba(255,255,255,.6);
}

h1{
color:white;
font-size:3rem;
margin:20px 0 10px;
}

p{
color:white;
font-size:1.2rem;
max-width:700px;
padding:0 20px;
}

button{
margin-top:20px;
padding:15px 25px;
font-size:18px;
border:none;
border-radius:40px;
background:white;
color:#ff4b7d;
font-weight:bold;
}

.flower{
position:fixed;
bottom:-100px;
pointer-events:none;
animation:float 10s linear forwards;
}

@keyframes float{
from{
transform:translateY(0) rotate(0deg);
opacity:1;
}
to{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}.music-btn{
padding:15px 30px;
border:none;
border-radius:50px;
background:white;
color:#ff4f87;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
.heart-animation{
font-size:120px;
margin-top:15px;
margin-bottom:10px;
animation:heartBeat 1.5s infinite;
filter:drop-shadow(0 0 20px hotpink);
}

@keyframes heartBeat{
0%{
transform:scale(1);
}
25%{
transform:scale(1.2);
}
50%{
transform:scale(1);
}
75%{
transform:scale(1.25);
}
100%{
transform:scale(1);
}
}
  #envelope-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#ffd9e8,#ffc6d8);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:99999;
cursor:pointer;
transition:1s;
}

.envelope{
font-size:120px;
animation:bounce 1.5s infinite;
}

@keyframes bounce{
50%{
transform:translateY(-15px);
}
}
</style>

}
</head>
<body>
  <div id="envelope-screen">
  <div class="envelope">💌</div>
  <h2>Tap To Open</h2>
</div>

<div id="main-content">

<audio id="music" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<img src="IMG-20260505-WA0012.jpg" class="photo">

<h1>For My Mayaluu ❤️</h1>
<button onclick="playSong()" class="music-btn">
🎵 Play Our Song
</button>
<div class="heart-animation">
💖✨💖
</div>
<p>
Babe, I loveee you sooooo muchhhhhhh 💕
</p>

<script>
const envelopeScreen =
document.getElementById("envelope-screen");

const mainContent =
document.getElementById("main-content");

mainContent.style.display="none";

envelopeScreen.onclick=()=>{

envelopeScreen.style.opacity="0";

setTimeout(()=>{
envelopeScreen.remove();
mainContent.style.display="block";
document.getElementById("music").play();
},800);

};
function playSong(){
document.getElementById("music").play();
}

const flowers=[
"pngwing.com.png",
"pngwing.com-1.png",
"pngwing.com-2.png"
];

function createFlower(){

let flower=document.createElement("img");

flower.src=flowers[Math.floor(Math.random()*flowers.length)];

flower.className="flower";

flower.style.left=Math.random()*100+"vw";

flower.style.width=(40+Math.random()*60)+"px";

document.body.appendChild(flower);

setTimeout(()=>{
flower.remove();
},10000);
}

setInterval(createFlower,800);

</script>
<audio id="music" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>
</body>
</html>
