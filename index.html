<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Mayaluu ❤️</title>

<style>
body{
margin:0;
background:#f8d6e2;
font-family:sans-serif;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
min-height:100vh;
text-align:center;
overflow:hidden;
}

.photo{
width:320px;
max-width:85vw;
border:8px solid white;
border-radius:25px;
box-shadow:0 0 25px rgba(255,255,255,.6);
}

h1{
color:white;
font-size:3rem;
margin:20px 0 10px;
}

p{
color:white;
font-size:1.2rem;
max-width:700px;
padding:0 20px;
}

button{
margin-top:20px;
padding:15px 25px;
font-size:18px;
border:none;
border-radius:40px;
background:white;
color:#ff4b7d;
font-weight:bold;
}

.flower{
position:fixed;
bottom:-100px;
pointer-events:none;
animation:float 10s linear forwards;
}

@keyframes float{
from{
transform:translateY(0) rotate(0deg);
opacity:1;
}
to{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}.music-btn{
padding:15px 30px;
border:none;
border-radius:50px;
background:white;
color:#ff4f87;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}
</style>

}
</head>
<body>

<audio id="music" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<img src="IMG-20260505-WA0012.jpg" class="photo">

<h1>For My Mayaluu ❤️</h1>
<button onclick="playSong()" class="music-btn">
🎵 Play Our Song
</button>
<p>
Babe, I loveee you sooooo muchhhhhhh 💕
</p>


<script>

function playSong(){
document.getElementById("music").play();
}

const flowers=[
"pngwing.com.png",
"pngwing.com-1.png",
"pngwing.com-2.png"
];

function createFlower(){

let flower=document.createElement("img");

flower.src=flowers[Math.floor(Math.random()*flowers.length)];

flower.className="flower";

flower.style.left=Math.random()*100+"vw";

flower.style.width=(40+Math.random()*60)+"px";

document.body.appendChild(flower);

setTimeout(()=>{
flower.remove();
},10000);
}

setInterval(createFlower,800);

</script>
<audio id="music" loop>
<source src="song.mp3" type="audio/mpeg">
</audio>
</body>
</html>
