<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Mayaluu ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e0,#ffc2d1);
text-align:center;
color:white;
overflow-x:hidden;
}

#envelopeScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#ffd6e0,#ffc2d1);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
cursor:pointer;
}

.envelope{
font-size:100px;
animation:bounce 1.5s infinite;
}

@keyframes bounce{
50%{transform:translateY(-15px);}
}

.hero{
padding:40px 20px;
}

.photo{
width:90%;
max-width:350px;
border-radius:25px;
border:5px solid white;
box-shadow:0 0 25px rgba(255,255,255,.6);
}

h1{
font-size:3rem;
margin-top:20px;
}

.message{
font-size:1.4rem;
max-width:700px;
margin:20px auto;
line-height:1.8;
padding:0 20px;
}

.date-box{
margin:30px auto;
padding:20px;
background:rgba(255,255,255,.2);
backdrop-filter:blur(10px);
border-radius:20px;
width:250px;
}

.counter{
font-size:2rem;
font-weight:bold;
margin-top:10px;
}

.song{
margin:40px auto;
width:90%;
max-width:500px;
}

.rose{
position:fixed;
font-size:30px;
animation:float 10s linear infinite;
pointer-events:none;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}
</style>
</head>

<body>

<div id="envelopeScreen">
<div class="envelope">💌</div>
<h2>For My Mayaluu ❤️</h2>
<p>Tap the envelope to open</p>
</div>

<div class="hero">

<img src="IMG-20260505-WA0012.jpg" class="photo">

<h1>For My Mayaluu ❤️</h1>

<div class="message">
Babe, I loveee you sooooo muchhhhhhh 💕<br><br>
Every moment with you feels special. You make my days brighter and my heart happier.
</div>

<div class="date-box">
💖 Anniversary Date 💖
<div>19 March 2026</div>
</div>

<div class="date-box">
Days Together
<div id="daysCounter" class="counter">0</div>
</div>

<div class="song">
<iframe style="border-radius:12px"
src="https://open.spotify.com/embed/track/3be9ACTxtcL6Zm4vJRUiPG"
width="100%"
height="152"
frameBorder="0"
allowfullscreen=""
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
</iframe>
</div>

</div>

<script>

const startDate = new Date("2026-03-19");
const today = new Date();

const diff = today - startDate;
const days = Math.max(0, Math.floor(diff/(1000*60*60*24)));

document.getElementById("daysCounter").innerText = days;

const envelope=document.getElementById("envelopeScreen");

envelope.addEventListener("click",()=>{
envelope.style.opacity="0";

setTimeout(()=>{
envelope.remove();
},800);
});

function createRose(){

let rose=document.createElement("div");

rose.className="rose";
rose.innerHTML="🌹";

rose.style.left=Math.random()*100+"vw";

document.body.appendChild(rose);

setTimeout(()=>{
rose.remove();
},10000);
}

setInterval(createRose,700);

</script>

</body>
</html>
