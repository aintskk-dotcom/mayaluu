<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Mayaluu ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
display:flex;
justify-content:center;
align-items:center;
}

.container{
text-align:center;
z-index:2;
}

.envelope{
font-size:120px;
cursor:pointer;
animation:bounce 2s infinite;
color:white;
}

.envelope p{
font-size:20px;
margin-top:10px;
}

@keyframes bounce{
50%{transform:translateY(-10px);}
}

.hidden{
display:none;
}

.message{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
padding:20px;
width:380px;
max-width:90vw;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
color:white;
}

.message img{
width:100%;
border-radius:20px;
margin-bottom:15px;
border:3px solid rgba(255,255,255,.5);
}

.bouquet{
font-size:45px;
margin-bottom:10px;
animation:float 2s infinite ease-in-out;
}

@keyframes float{
50%{
transform:translateY(-8px);
}
}

#typed{
min-height:220px;
line-height:1.8;
font-size:16px;
}

.heart{
position:absolute;
font-size:24px;
animation:rise linear forwards;
}

@keyframes rise{
from{
transform:translateY(100vh);
opacity:1;
}
to{
transform:translateY(-100px);
opacity:0;
}
}

.rose{
position:absolute;
font-size:22px;
animation:fall linear forwards;
}

@keyframes fall{
from{
transform:translateY(-50px);
}
to{
transform:translateY(110vh);
}
}

@keyframes sparkle{
from{
opacity:1;
transform:scale(.5);
}
to{
opacity:0;
transform:scale(1.5);
}
}

.sparkle{
position:absolute;
font-size:18px;
animation:sparkle 3s linear forwards;
}
</style>
</head>

<body>

<div class="container">

<div class="envelope" id="envelope">
💌
<p>Tap To Open</p>
</div>

<div class="message hidden" id="message">

<img src="IMG-20260505-WA0012.jpg" alt="Our Photo">

<div class="bouquet">
🌹🌹🌹🌹🌹
</div>

<h2>For My Mayaluu ❤️</h2>
<br>

<p id="typed"></p>

<br>

<h3>Forever Yours,<br> Lil Guy 💕</h3>

</div>

</div>

<script>

const text =
`Babe, I loveee you soooooo muchhhhhhh ❤️

Every moment with you feels special.

Your smile brightens my day,
your presence makes everything better,
and every memory with you is precious.

Thank you for being my happiness,
my comfort,
and my favorite person.

I love you more than words can explain.

Forever and always ❤️🌹✨`;

document.getElementById("envelope").onclick = () => {

document.getElementById("envelope").classList.add("hidden");
document.getElementById("message").classList.remove("hidden");

let i=0;

function type(){
if(i<text.length){
document.getElementById("typed").innerHTML += text.charAt(i);
i++;
setTimeout(type,35);
}
}

type();

};

function createHeart(){

let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);
}

setInterval(createHeart,400);

function createRose(){

let rose=document.createElement("div");
rose.className="rose";
rose.innerHTML="🌹";

rose.style.left=Math.random()*100+"vw";
rose.style.animationDuration=(4+Math.random()*5)+"s";

document.body.appendChild(rose);

setTimeout(()=>{
rose.remove();
},9000);
}

setInterval(createRose,700);

function sparkle(){

let s=document.createElement("div");

s.className="sparkle";
s.innerHTML="✨";

s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";

document.body.appendChild(s);

setTimeout(()=>{
s.remove();
},3000);
}

setInterval(sparkle,500);
  // Anniversary popup after 8 seconds

setTimeout(()=>{

const popup=document.createElement("div");

popup.innerHTML=`
<div style="
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:25px;
border-radius:20px;
color:#ff4d88;
box-shadow:0 0 30px rgba(0,0,0,.2);
z-index:9999;
text-align:center;
max-width:300px;
">
<h2>💖 Our Anniversary 💖</h2>
<p>19 March 2026</p>
<p>For My Mayaluu ❤️</p>
<button onclick="this.parentElement.parentElement.remove()"
style="
padding:10px 20px;
border:none;
border-radius:20px;
background:#ff4d88;
color:white;
cursor:pointer;
">
Close
</button>
</div>
`;

document.body.appendChild(popup);

},8000);

</script>

</body>
</html>
